# XcodeGen spec — the .xcodeproj is generated, not committed.
#
#   brew install xcodegen   # already present
#   cd ios-swift && xcodegen generate
#
# Keeping the spec in git instead of project.pbxproj means the project is
# reviewable in a diff and never produces a merge conflict nobody can read.
name: MoonCompass

options:
  bundleIdPrefix: org.mediarise
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "2700"

settings:
  base:
    # Swift 6 language mode: data-race safety is checked by the compiler. The
    # token refresh and the StoreKit transaction listener are exactly the places
    # where races would otherwise hide.
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 39CP3623CD
    CODE_SIGN_STYLE: Automatic
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULE_VERIFIER: NO
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "14"

targets:
  MoonCompass:
    type: application
    platform: iOS
    sources:
      - path: MoonCompass
        excludes:
          - "**/.DS_Store"
      # Translations are shared with the React Native (Android) client and
      # referenced in place, so the two apps can never drift apart. Copied into
      # the bundle as an `i18n/` folder.
      - path: ../i18n
        type: folder
        buildPhase: resources
      # iOS-only strings (App Store purchase wording), layered over the shared
      # files by `Localizer` so the Android translations stay untouched.
      - path: Localization/i18n_ios
        type: folder
        buildPhase: resources
      # Card meanings and the classic Rider–Waite art, shared the same way.
      - path: ../data/tarot_en.json
        buildPhase: resources
      - path: ../data/tarot_ru.json
        buildPhase: resources
      - path: ../data/tarot_th.json
        buildPhase: resources
      - path: ../assets/cards
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.mediarise.tarot
        # No PRODUCT_NAME override: a space in it yields "Moon Compass.app/Moon
        # Compass" and a module named Moon_Compass, which breaks the test host
        # path. The name shown on the home screen comes from
        # CFBundleDisplayName in Info.plist instead.
        INFOPLIST_FILE: MoonCompass/Support/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone and iPad: the App Store listing already has iPad screenshots
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        release:
          SWIFT_COMPILATION_MODE: wholemodule
    dependencies:
      - sdk: StoreKit.framework
      - sdk: AVKit.framework

  MoonCompassTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MoonCompassTests
      # The same StoreKit configuration Xcode runs the app with, so tests can
      # buy against it with SKTestSession.
      - path: MoonCompass.storekit
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.mediarise.tarot.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MoonCompass

schemes:
  MoonCompass:
    build:
      targets:
        MoonCompass: all
        MoonCompassTests: [test]
    run:
      config: Debug
      # Local StoreKit testing when run from Xcode: products and purchases
      # come from this file instead of App Store Connect.
      storeKitConfiguration: MoonCompass.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - MoonCompassTests
    archive:
      config: Release
