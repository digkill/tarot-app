services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tarot
      POSTGRES_PASSWORD: tarot
      POSTGRES_DB: tarot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tarot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
